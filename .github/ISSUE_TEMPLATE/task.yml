name: 📋 Task
description: A chore, refactor, dependency bump, or technical task
labels: ["task"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🟠 High — do this soon
        - 🟡 Medium — do this when convenient
        - 🟢 Low — backlog / whenever
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough effort estimate
      options:
        - 🟢 Small (~1–2h)
        - 🟡 Medium (~half day)
        - 🟠 Large (1–2 days)
        - 🔴 XL (multi-day epic — consider splitting)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Sub-tasks
      description: Break it down into smaller items if possible.
      placeholder: |
        - [ ] Item 1
        - [ ] Item 2
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant files, links, or notes.
    validations:
      required: false
