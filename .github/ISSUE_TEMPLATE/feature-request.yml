name: ✨ Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔴 Critical — must-have for release
        - 🟠 High — important, should do soon
        - 🟡 Medium — nice to have
        - 🟢 Low — backlog / whenever
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough effort estimate
      options:
        - 🟢 Small (~1–2h)
        - 🟡 Medium (~half day)
        - 🟠 Large (1–2 days)
        - 🔴 XL (multi-day epic — consider splitting)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve or what's missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Sub-tasks / acceptance criteria
      description: Break it into actionable items so you can track progress on the board.
      placeholder: |
        - [ ] Item 1
        - [ ] Item 2
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or anything else relevant.
    validations:
      required: false
