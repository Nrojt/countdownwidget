name: 🐛 Bug Report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔴 Critical — app crash / data loss
        - 🟠 High — broken core feature
        - 🟡 Medium — broken edge case / minor annoyance
        - 🟢 Low — cosmetic / nitpick
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack trace
      description: Paste any relevant logcat output or stack traces.
      render: shell
    validations:
      required: false
